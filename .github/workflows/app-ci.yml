name: app (CakePHP 5)

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/app-ci.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/app-ci.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kualitet_app
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: kualitet_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kualitet_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_TEST_URL: postgres://kualitet_app:ci_only_password@127.0.0.1:5432/kualitet_app_test
      SECURITY_SALT: ci-only-salt-not-used-anywhere-else-0123456789

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_pgsql
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Create local configuration
        run: composer run-script post-install-cmd --no-interaction

      - name: Tests
        run: vendor/bin/phpunit

      - name: Coding standard
        run: vendor/bin/phpcs
